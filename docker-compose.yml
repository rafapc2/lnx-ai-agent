services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-leanix_agent}
      POSTGRES_USER: ${POSTGRES_USER:-leanix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leanix_password}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  leanix-mcp:
    build: ./services/leanix-mcp
    env_file: .env
    ports:
      - "8002:8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health').read()"]
      interval: 5s
      timeout: 5s
      retries: 20

  snapshot-service:
    build: ./services/snapshot-service
    env_file: .env
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy
      leanix-mcp:
        condition: service_healthy
      redis:
        condition: service_healthy

  agent-api:
    build: ./services/agent-api
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      snapshot-service:
        condition: service_started
      leanix-mcp:
        condition: service_healthy

volumes:
  pg_data:
